apiVersion: storage.kubestash.com/v1alpha1
kind: RetentionPolicy
metadata:
  name: demo-retention
  namespace: storage
spec:
  successfulSnapshots:
    last: 3
  failedSnapshots:
    last: 2
  usagePolicy:
    allowedNamespaces:
      from: Selector
      selector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["demo", "demo-restore"]
