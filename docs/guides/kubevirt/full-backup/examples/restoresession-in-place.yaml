apiVersion: core.kubestash.com/v1alpha1
kind: RestoreSession
metadata:
  name: vmtest-restore-inplace
  namespace: demo
spec:
  dataSource:
    repository: vmtest-repo
    snapshot: latest
    encryptionSecret:
      name: encryption-secret
      namespace: demo
  addon:
    name: kubevirt
    tasks:
    - name: logical-restore
