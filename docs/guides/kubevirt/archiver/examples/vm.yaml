apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vmtest
  namespace: demo
  labels:
    cbt: enabled
    archive: enabled
spec:
  runStrategy: Always
  dataVolumeTemplates:
  - metadata:
      name: vmtest-root
    spec:
      pvc:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
        storageClassName: local-path
      source:
        registry:
          url: "docker://quay.io/kubevirt/cirros-container-disk-demo:latest"
  template:
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 512Mi
        machine:
          type: q35
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
      networks:
      - name: default
        pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: rootdisk
        dataVolume:
          name: vmtest-root
